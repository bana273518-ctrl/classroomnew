<!-- ... existing code ... -->
    <!-- Application Logic with Global Public Sync Storage -->
    <script>
        const ROOMS = ['1404호', '2205호', '2206호', '2408호', '3504호', '7210호'];
        const DEPTS = [
            { name: '스재/반산 조교', badgeClass: 'bg-blue-100 text-blue-800 border-blue-200', bgSolid: 'bg-blue-600', borderLeft: 'border-l-4 border-blue-500', bgLight: 'bg-blue-50/70' },
            { name: '의료뷰티 조교', badgeClass: 'bg-pink-100 text-pink-800 border-pink-200', bgSolid: 'bg-pink-500', borderLeft: 'border-l-4 border-pink-500', bgLight: 'bg-pink-50/70' },
            { name: '호텔조리 조교', badgeClass: 'bg-amber-100 text-amber-800 border-amber-200', bgSolid: 'bg-amber-500', borderLeft: 'border-l-4 border-amber-500', bgLight: 'bg-amber-50/70' },
            { name: '식품영양 조교', badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-200', bgSolid: 'bg-emerald-500', borderLeft: 'border-l-4 border-emerald-500', bgLight: 'bg-emerald-50/70' }
        ];

        const TIME_SLOTS = [
            '09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00', '21:00'
        ];

        let reservations = [];
        let selectedFilterRoom = 'ALL';
        let currentViewMode = 'timetable';
        let pendingDeleteId = null;
        let selectedFormDates = [];

        const MASTER_STORAGE_KEY = 'classroom_local_cache_master_v2';
        const PUBLIC_SYNC_URL = 'https://api.myjson.online/v1/records/4427958e-0931-4127-9cda-ef76971a1d12';

        window.addEventListener('DOMContentLoaded', function() {
            initApp();
        });

        function initApp() {
            const todayStr = getTodayDateString();
            
            const dateInput = document.getElementById('date-picker-input');
            const filterDate = document.getElementById('filter-date');
            
            if (dateInput) dateInput.value = todayStr;
            if (filterDate) filterDate.value = todayStr;

            selectedFormDates = [todayStr];
            renderDateChips();

            renderClassroomButtons();
            populateTimeDropdowns();
            renderFilterTabs();

            loadLocalData();
            renderAll();

            // Pull immediately and poll for realtime sync
            fetchGlobalCloudData();
            setInterval(fetchGlobalCloudData, 2000);
        }

        function getTodayDateString() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function loadLocalData() {
            const saved = localStorage.getItem(MASTER_STORAGE_KEY);
            if (saved) {
                try { reservations = JSON.parse(saved); } catch(e) { reservations = []; }
            }
        }

        function saveLocalData() {
            localStorage.setItem(MASTER_STORAGE_KEY, JSON.stringify(reservations));
        }

        // Global Realtime Fetcher
        async function fetchGlobalCloudData() {
            try {
                const res = await fetch(PUBLIC_SYNC_URL, {
                    headers: { 'x-collection-id': 'classroom_4dept_shared' }
                });
                if (res.ok) {
                    const json = await res.json();
                    if (json && Array.isArray(json.data)) {
                        reservations = json.data;
                        saveLocalData();
                        renderAll();
                    }
                }
            } catch (err) {
                // Keep local cache if offline
            }
        }

        // Global Push on Reservation Add/Delete
        async function pushGlobalCloudData() {
            saveLocalData();
            renderAll();
            try {
                await fetch(PUBLIC_SYNC_URL, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-collection-id': 'classroom_4dept_shared'
                    },
                    body: JSON.stringify({ data: reservations })
                });
            } catch (err) {
                // Sync error handler
            }
        }

        function addSelectedDate() {
            const dateInput = document.getElementById('date-picker-input');
            if (!dateInput) return;
            const dateVal = dateInput.value;
            if (!dateVal) return;

            if (selectedFormDates.includes(dateVal)) {
                showToast('이미 선택된 날짜입니다.', 'info');
                return;
            }

            selectedFormDates.push(dateVal);
            selectedFormDates.sort();
            renderDateChips();
        }

        function removeSelectedDate(dateVal) {
            selectedFormDates = selectedFormDates.filter(d => d !== dateVal);
            renderDateChips();
        }

        function renderDateChips() {
            const container = document.getElementById('selected-date-chips');
            const countEl = document.getElementById('selected-dates-count');

            if (countEl) countEl.innerText = `${selectedFormDates.length}개 선택됨`;
            if (!container) return;

            if (selectedFormDates.length === 0) {
                container.innerHTML = `<span class="text-xs text-slate-400 italic">선택된 날짜가 없습니다. 날짜를 추가해주세요.</span>`;
                return;
            }

            container.innerHTML = selectedFormDates.map(date => `
                <span class="inline-flex items-center gap-1 px-2.5 py-1 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-lg text-xs font-semibold">
                    ${date}
                    <button type="button" onclick="removeSelectedDate('${date}')" class="text-indigo-400 hover:text-rose-600 transition-colors ml-0.5">
                        <i class="fa-solid fa-xmark text-[11px]"></i>
                    </button>
                </span>
            `).join('');
        }

        function resetDataPrompt() {
            if (confirm('모든 학과 공유 예약 데이터를 초기화하시겠습니까?')) {
                reservations = [];
                pushGlobalCloudData();
                showToast('공유 데이터가 성공적으로 초기화되었습니다.', 'success');
            }
        }

        function getDeptConfig(deptName) {
            return DEPTS.find(d => d.name === deptName) || {
                name: deptName,
                badgeClass: 'bg-slate-100 text-slate-800 border-slate-200',
                bgSolid: 'bg-slate-600',
                borderLeft: 'border-l-4 border-slate-500',
                bgLight: 'bg-slate-50'
            };
        }

        function renderClassroomButtons() {
            const container = document.getElementById('classroom-selector-buttons');
            if (!container) return;
            container.innerHTML = ROOMS.map((room) => `
                <button type="button" onclick="selectFormRoom('${room}')" id="room-btn-${room}"
                    class="room-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition-all text-center">
                    ${room}
                </button>
            `).join('');
            selectFormRoom(ROOMS[0]);
        }

        function selectFormRoom(room) {
            const formRoom = document.getElementById('form-room');
            if (formRoom) formRoom.value = room;
            document.querySelectorAll('.room-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600', 'shadow-sm');
                btn.classList.add('bg-slate-50', 'text-slate-600', 'border-slate-200');
            });
            const activeBtn = document.getElementById(`room-btn-${room}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-slate-50', 'text-slate-600', 'border-slate-200');
                activeBtn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600', 'shadow-sm');
            }
        }

        function populateTimeDropdowns() {
            const startSelect = document.getElementById('form-start-time');
            const endSelect = document.getElementById('form-end-time');

            if (!startSelect || !endSelect) return;

            const startOptions = TIME_SLOTS.slice(0, -1).map(t => `<option value="${t}">${t}</option>`).join('');
            const endOptions = TIME_SLOTS.slice(1).map(t => `<option value="${t}">${t}</option>`).join('');

            startSelect.innerHTML = startOptions;
            endSelect.innerHTML = endOptions;

            startSelect.value = '09:00';
            endSelect.value = '10:00';

            startSelect.addEventListener('change', () => {
                const startIdx = TIME_SLOTS.indexOf(startSelect.value);
                const endIdx = TIME_SLOTS.indexOf(endSelect.value);
                if (startIdx >= endIdx) {
                    endSelect.value = TIME_SLOTS[startIdx + 1] || TIME_SLOTS[TIME_SLOTS.length - 1];
                }
            });
        }

        function renderFilterTabs() {
            const container = document.getElementById('room-filter-tabs');
            if (!container) return;
            const tabs = [{ id: 'ALL', name: '전체 강의실' }, ...ROOMS.map(r => ({ id: r, name: r }))];
            
            container.innerHTML = tabs.map(tab => {
                const isActive = selectedFilterRoom === tab.id;
                return `
                    <button onclick="setRoomFilter('${tab.id}')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${
                        isActive 
                        ? 'bg-slate-900 text-white shadow-sm' 
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }">
                        ${tab.name}
                    </button>
                `;
            }).join('');
        }

        function setRoomFilter(roomId) {
            selectedFilterRoom = roomId;
            renderFilterTabs();
            renderAll();
        }

        function switchViewMode(mode) {
            currentViewMode = mode;
            
            const btnTimetable = document.getElementById('view-mode-timetable');
            const btnCard = document.getElementById('view-mode-card');

            if (btnTimetable && btnCard) {
                if (mode === 'timetable') {
                    btnTimetable.className = 'px-2.5 py-1 rounded-lg text-xs font-semibold transition-all bg-white text-indigo-600 shadow-sm';
                    btnCard.className = 'px-2.5 py-1 rounded-lg text-xs font-semibold transition-all text-slate-500 hover:text-slate-800';
                } else {
                    btnCard.className = 'px-2.5 py-1 rounded-lg text-xs font-semibold transition-all bg-white text-indigo-600 shadow-sm';
                    btnTimetable.className = 'px-2.5 py-1 rounded-lg text-xs font-semibold transition-all text-slate-500 hover:text-slate-800';
                }
            }

            renderMainDisplay();
        }

        function renderAll() {
            renderSummaryCards();
            renderMainDisplay();
        }

        function renderSummaryCards() {
            const container = document.getElementById('room-summary-container');
            const filterDateEl = document.getElementById('filter-date');
            if (!container || !filterDateEl) return;
            const selectedDate = filterDateEl.value;

            container.innerHTML = ROOMS.map(room => {
                const count = reservations.filter(r => r.room === room && r.date === selectedDate).length;
                const isSelected = selectedFilterRoom === room;

                return `
                    <div onclick="setRoomFilter('${room}')" class="bg-white p-3 rounded-2xl border ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-100' : 'border-slate-200'} shadow-sm hover:shadow-md transition-all cursor-pointer flex flex-col justify-between">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-500">${room}</span>
                            <span class="w-2 h-2 rounded-full ${count > 0 ? 'bg-emerald-500' : 'bg-slate-300'}"></span>
                        </div>
                        <div class="mt-2 flex items-baseline justify-between">
                            <span class="text-xl font-extrabold ${count > 0 ? 'text-indigo-600' : 'text-slate-400'}">${count}건</span>
                            <span class="text-[10px] text-slate-400">오늘 대여</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMainDisplay() {
            const container = document.getElementById('display-container');
            const filterDateEl = document.getElementById('filter-date');
            if (!container || !filterDateEl) return;
            const selectedDate = filterDateEl.value;

            let filtered = reservations.filter(r => r.date === selectedDate);
            if (selectedFilterRoom !== 'ALL') {
                filtered = filtered.filter(r => r.room === selectedFilterRoom);
            }

            if (currentViewMode === 'timetable') {
                renderTimetable(container, filtered, selectedDate);
            } else {
                renderCardGrid(container, filtered, selectedDate);
            }
        }

        function renderTimetable(container, filtered, selectedDate) {
            const activeRooms = selectedFilterRoom === 'ALL' ? ROOMS : [selectedFilterRoom];
            const displayHours = TIME_SLOTS.slice(0, -1);

            let html = `
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full border-collapse text-left text-xs">
                        <thead>
                            <tr class="border-b border-slate-200">
                                <th class="p-2.5 font-bold text-slate-400 bg-slate-50/50 w-20 text-center sticky left-0 z-10">시간</th>
                                ${activeRooms.map(r => `
                                    <th class="p-2.5 font-bold text-slate-700 bg-slate-50/50 text-center min-w-[140px]">
                                        <div class="inline-block px-2.5 py-0.5 bg-slate-200/60 rounded-md">${r}</div>
                                    </th>
                                `).join('')}
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
            `;

            displayHours.forEach(hour => {
                html += `<tr>`;
                html += `<td class="p-2.5 font-semibold text-slate-400 text-center bg-slate-50/30 sticky left-0 border-r border-slate-100">${hour}</td>`;

                activeRooms.forEach(room => {
                    const matchingBooking = filtered.find(r => {
                        if (r.room !== room) return false;
                        return (r.startTime <= hour && r.endTime > hour);
                    });

                    if (matchingBooking) {
                        const deptCfg = getDeptConfig(matchingBooking.dept);
                        const isStart = matchingBooking.startTime === hour;

                        html += `
                            <td class="p-1 align-top">
                                <div class="h-full min-h-[46px] p-2 rounded-xl ${deptCfg.bgLight} ${deptCfg.borderLeft} flex flex-col justify-between relative group">
                                    <div class="flex items-center justify-between gap-1">
                                        <span class="font-bold text-[11px] text-slate-800 truncate">${matchingBooking.purpose}</span>
                                        ${isStart ? `
                                            <button onclick="openDeleteModal('${matchingBooking.id}')" class="text-slate-400 hover:text-rose-600 opacity-0 group-hover:opacity-100 transition-opacity p-0.5">
                                                <i class="fa-solid fa-xmark text-xs"></i>
                                            </button>
                                        ` : ''}
                                    </div>
                                    <div class="flex items-center justify-between text-[10px] text-slate-500 mt-1">
                                        <span class="font-medium text-slate-600 truncate">${matchingBooking.dept.replace(' 조교','')} (${matchingBooking.assistant.split(' ')[0]})</span>
                                        <span class="font-mono text-slate-400">${matchingBooking.startTime}-${matchingBooking.endTime}</span>
                                    </div>
                                </div>
                            </td>
                        `;
                    } else {
                        html += `
                            <td class="p-1">
                                <div class="h-full min-h-[46px] rounded-xl border border-dashed border-slate-100 hover:border-indigo-200 hover:bg-indigo-50/30 transition-all flex items-center justify-center text-slate-300">
                                    <span class="text-[10px] opacity-0 hover:opacity-100 text-indigo-400 font-medium">비어있음</span>
                                </div>
                            </td>
                        `;
                    }
                });

                html += `</tr>`;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        function renderCardGrid(container, filtered, selectedDate) {
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-16 text-slate-400 space-y-3">
                        <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center text-2xl text-slate-300">
                            <i class="fa-regular fa-calendar-xmark"></i>
                        </div>
                        <p class="text-sm font-medium">선택한 날짜 및 조건에 등록된 예약이 없습니다.</p>
                        <p class="text-xs text-slate-400">좌측 서식에서 새로 대여 신청을 등록해 보세요.</p>
                    </div>
                `;
                return;
            }

            filtered.sort((a, b) => a.startTime.localeCompare(b.startTime) || a.room.localeCompare(b.room));

            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                    ${filtered.map(item => {
                        const deptCfg = getDeptConfig(item.dept);
                        return `
                            <div class="bg-slate-50/60 hover:bg-slate-50 border border-slate-200 rounded-2xl p-4 shadow-sm hover:shadow transition-all space-y-3">
                                <div class="flex items-start justify-between gap-2">
                                    <div class="space-y-1">
                                        <div class="flex items-center gap-2">
                                            <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold bg-slate-900 text-white">${item.room}</span>
                                            <span class="px-2.5 py-0.5 rounded-lg text-xs font-semibold border ${deptCfg.badgeClass}">
                                                ${item.dept}
                                            </span>
                                        </div>
                                        <h3 class="font-bold text-slate-800 text-sm pt-1">${item.purpose}</h3>
                                    </div>
                                    <button onclick="openDeleteModal('${item.id}')" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg hover:bg-rose-50 transition-colors" title="삭제">
                                        <i class="fa-regular fa-trash-can text-sm"></i>
                                    </button>
                                </div>

                                <div class="pt-2 border-t border-slate-200/60 flex items-center justify-between text-xs text-slate-600">
                                    <div class="flex items-center gap-1.5 font-semibold text-indigo-700">
                                        <i class="fa-regular fa-clock"></i>
                                        <span>${item.startTime} ~ ${item.endTime}</span>
                                    </div>
                                    <div class="flex items-center gap-1 text-slate-500">
                                        <i class="fa-regular fa-user"></i>
                                        <span>${item.assistant}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        async function handleReservationSubmit(e) {
            e.preventDefault();

            const dept = document.getElementById('form-dept').value;
            const assistant = document.getElementById('form-assistant').value.trim();
            const room = document.getElementById('form-room').value;
            const startTime = document.getElementById('form-start-time').value;
            const endTime = document.getElementById('form-end-time').value;
            const purpose = document.getElementById('form-purpose').value.trim();

            if (selectedFormDates.length === 0) {
                showToast('최소 하나 이상의 사용 날짜를 선택해야 합니다.', 'error');
                return;
            }

            if (startTime >= endTime) {
                showToast('종료 시간은 시작 시간보다 나중이어야 합니다.', 'error');
                return;
            }

            const conflicts = [];
            selectedFormDates.forEach(date => {
                const conflict = reservations.find(r => {
                    if (r.room !== room || r.date !== date) return false;
                    return (startTime < r.endTime && endTime > r.startTime);
                });
                if (conflict) {
                    conflicts.push({ date, conflict });
                }
            });

            if (conflicts.length > 0) {
                const first = conflicts[0];
                showToast(`[중복 예약] ${first.date} ${room}에 이미 ${first.conflict.startTime}~${first.conflict.endTime} (${first.conflict.dept}) 대여가 있습니다.`, 'error');
                return;
            }

            for (const date of selectedFormDates) {
                const newBooking = {
                    id: 'res-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6),
                    dept,
                    assistant,
                    room,
                    date,
                    startTime,
                    endTime,
                    purpose
                };
                reservations.push(newBooking);
            }

            await pushGlobalCloudData();

            const filterDateEl = document.getElementById('filter-date');
            if (filterDateEl) filterDateEl.value = selectedFormDates[0];
            
            const purposeEl = document.getElementById('form-purpose');
            if (purposeEl) purposeEl.value = '';
            
            showToast(`${room} 대여 신청이 성공적으로 공유되었습니다.`, 'success');
        }

        function openDeleteModal(id) {
            const target = reservations.find(r => r.id === id);
            if (!target) return;

            pendingDeleteId = id;
            const infoEl = document.getElementById('delete-modal-info');
            if (infoEl) infoEl.innerText = `${target.date} | ${target.room} | ${target.startTime}~${target.endTime} (${target.dept})`;
            
            const modal = document.getElementById('delete-modal');
            const content = document.getElementById('delete-modal-content');
            
            if (modal && content) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    content.classList.remove('scale-95', 'opacity-0');
                    content.classList.add('scale-100', 'opacity-100');
                }, 10);
            }

            const confirmBtn = document.getElementById('confirm-delete-btn');
            if (confirmBtn) confirmBtn.onclick = confirmDelete;
        }

        function closeDeleteModal() {
            const modal = document.getElementById('delete-modal');
            const content = document.getElementById('delete-modal-content');
            
            if (modal && content) {
                content.classList.remove('scale-100', 'opacity-100');
                content.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    pendingDeleteId = null;
                }, 200);
            }
        }

        async function confirmDelete() {
            if (!pendingDeleteId) return;

            const targetId = pendingDeleteId;
            reservations = reservations.filter(r => r.id !== targetId);
            
            await pushGlobalCloudData();

            closeDeleteModal();
            showToast('대여 신청이 삭제 및 공유 반영되었습니다.', 'info');
        }

        let toastTimeout;
        function showToast(msg, type = 'info') {
            clearTimeout(toastTimeout);
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            const iconEl = document.getElementById('toast-icon');

            if (!toast || !msgEl || !iconEl) return;

            msgEl.innerText = msg;

            if (type === 'error') {
                iconEl.innerHTML = `<i class="fa-solid fa-circle-exclamation text-rose-500"></i>`;
                toast.className = toast.className.replace(/border-\w+-200/, 'border-rose-200');
            } else if (type === 'success') {
                iconEl.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500"></i>`;
                toast.className = toast.className.replace(/border-\w+-200/, 'border-emerald-200');
            } else {
                iconEl.innerHTML = `<i class="fa-solid fa-circle-info text-indigo-500"></i>`;
                toast.className = toast.className.replace(/border-\w+-200/, 'border-indigo-200');
            }

            toast.classList.remove('translate-y-[-100px]', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-0', 'opacity-100');

            toastTimeout = setTimeout(() => {
                hideToast();
            }, 3500);
        }

        function hideToast() {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.classList.add('translate-y-[-100px]', 'opacity-0', 'pointer-events-none');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }
        }
    </script>
</body>
</html>
