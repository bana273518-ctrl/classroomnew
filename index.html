<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공용강의실 대여 및 현황 관리 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Noto Sans KR Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-y-[-100px] opacity-0 pointer-events-none transition-all duration-300 max-w-sm w-full bg-white border border-slate-200 shadow-xl rounded-2xl p-4 flex items-center gap-3">
        <div id="toast-icon" class="text-xl"></div>
        <div id="toast-message" class="text-xs font-semibold text-slate-700 flex-1"></div>
    </div>

    <!-- Header Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-school text-lg"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="font-bold text-slate-900 text-base sm:text-lg tracking-tight">공용강의실 대여 및 현황 관리</h1>
                        <span id="sync-status-badge" class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-emerald-100 text-emerald-700 flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span> 실시간 전역 연동 연결됨
                        </span>
                    </div>
                    <p class="text-[11px] text-slate-500">스재/반산 • 의료뷰티 • 호텔조리 • 식품영양 조교 통합 플랫폼</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- Dept Badges -->
                <div class="hidden lg:flex items-center gap-1.5 mr-2">
                    <span class="px-2 py-1 rounded-lg text-[11px] font-semibold bg-blue-50 text-blue-700 border border-blue-200">● 스재/반산</span>
                    <span class="px-2 py-1 rounded-lg text-[11px] font-semibold bg-pink-50 text-pink-700 border border-pink-200">● 의료뷰티</span>
                    <span class="px-2 py-1 rounded-lg text-[11px] font-semibold bg-amber-50 text-amber-700 border border-amber-200">● 호텔조리</span>
                    <span class="px-2 py-1 rounded-lg text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">● 식품영양</span>
                </div>
                
                <button onclick="resetDataPrompt()" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition-colors" title="데이터 초기화">
                    <i class="fa-solid fa-rotate-right text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Top Classroom Status Cards -->
        <section>
            <div id="room-summary-container" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                <!-- Room summary cards rendered by JS -->
            </div>
        </section>

        <!-- Form & Timetable Section -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- Reservation Form Sidebar (4 cols) -->
            <section class="lg:col-span-4 bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-4">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                    <h2 class="font-bold text-slate-900 text-sm flex items-center gap-2">
                        <i class="fa-regular fa-calendar-plus text-indigo-600"></i>
                        강의실 대여 신청
                    </h2>
                    <span class="text-[10px] font-medium text-rose-500">* 중복 예약 자동 체크</span>
                </div>

                <form onsubmit="handleReservationSubmit(event)" class="space-y-4">
                    <!-- Dept Selection -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">신청 학과 <span class="text-rose-500">*</span></label>
                        <select id="form-dept" required class="w-full text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                            <option value="">학과를 선택하세요</option>
                            <option value="스재/반산 조교">스재/반산 조교</option>
                            <option value="의료뷰티 조교">의료뷰티 조교</option>
                            <option value="호텔조리 조교">호텔조리 조교</option>
                            <option value="식품영양 조교">식품영양 조교</option>
                        </select>
                    </div>

                    <!-- Assistant Info -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">신청자 (조교 이름 / 연락처) <span class="text-rose-500">*</span></label>
                        <input type="text" id="form-assistant" required placeholder="예: 김조교 (010-1234-5678)" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                    </div>

                    <!-- Room Selection Buttons -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1.5">대여 강의실 <span class="text-rose-500">*</span></label>
                        <input type="hidden" id="form-room" value="1404호">
                        <div id="classroom-selector-buttons" class="grid grid-cols-3 gap-1.5">
                            <!-- Buttons rendered by JS -->
                        </div>
                    </div>

                    <!-- Multi-Date Picker -->
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <label class="text-xs font-semibold text-slate-600">사용 날짜 선택 (다중 선택 가능) <span class="text-rose-500">*</span></label>
                            <span id="selected-dates-count" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">1개 선택됨</span>
                        </div>
                        
                        <div class="flex items-center gap-1.5 mb-2">
                            <input type="date" id="date-picker-input" class="flex-1 text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                            <button type="button" onclick="addSelectedDate()" class="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold rounded-xl border border-indigo-200 transition-all flex items-center gap-1 whitespace-nowrap">
                                <i class="fa-solid fa-plus text-[10px]"></i> 날짜 추가
                            </button>
                        </div>

                        <!-- Date Chips Container -->
                        <div id="selected-date-chips" class="flex flex-wrap gap-1.5 p-2.5 bg-slate-50 rounded-xl border border-slate-200 min-h-[42px] items-center">
                            <!-- Chips rendered by JS -->
                        </div>
                    </div>

                    <!-- Time Selection -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">시작 시간 <span class="text-rose-500">*</span></label>
                            <select id="form-start-time" class="w-full text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                                <!-- Options populated by JS -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">종료 시간 <span class="text-rose-500">*</span></label>
                            <select id="form-end-time" class="w-full text-xs font-medium bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
                                <!-- Options populated by JS -->
                            </select>
                        </div>
                    </div>

                    <!-- Purpose -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">사용 목적 및 비고 <span class="text-rose-500">*</span></label>
                        <textarea id="form-purpose" required rows="2" placeholder="예: 전공 실습 특강, 보강 수업, 학생 개별 연습 등" class="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all resize-none"></textarea>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold text-xs rounded-xl shadow-md shadow-indigo-200 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                        대여 신청 등록
                    </button>
                </form>
            </section>

            <!-- Timetable & Card View Container (8 cols) -->
            <section class="lg:col-span-8 bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-4">
                <!-- Toolbar Header -->
                <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
                    
                    <!-- Room Filter Tabs -->
                    <div id="room-filter-tabs" class="flex items-center gap-1 overflow-x-auto custom-scrollbar pb-1 sm:pb-0">
                        <!-- Tabs rendered by JS -->
                    </div>

                    <!-- Controls: Date Filter & View Switcher -->
                    <div class="flex items-center justify-between sm:justify-end gap-2">
                        <!-- Filter Date Input -->
                        <div class="relative">
                            <input type="date" id="filter-date" onchange="renderAll()" class="text-xs font-semibold bg-slate-100 text-slate-700 border-0 rounded-xl px-3 py-1.5 focus:ring-2 focus:ring-indigo-500">
                        </div>

                        <!-- View Switcher -->
                        <div class="bg-slate-100 p-1 rounded-xl flex items-center gap-1 border border-slate-200">
                            <button id="view-mode-timetable" onclick="switchViewMode('timetable')" class="px-2.5 py-1 rounded-lg text-xs font-semibold transition-all bg-white text-indigo-600 shadow-sm">
                                <i class="fa-solid fa-chart-simple mr-1"></i> 시간표
                            </button>
                            <button id="view-mode-card" onclick="switchViewMode('card')" class="px-2.5 py-1 rounded-lg text-xs font-semibold transition-all text-slate-500 hover:text-slate-800">
                                <i class="fa-solid fa-list-ul mr-1"></i> 목록
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Main Schedule Output Area -->
                <div id="display-container" class="min-h-[400px]">
                    <!-- Rendered by JS -->
                </div>
            </section>

        </div>
    </main>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div id="delete-modal-content" class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl transform scale-95 opacity-0 transition-all duration-200 space-y-4">
            <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center text-xl mx-auto">
                <i class="fa-regular fa-trash-can"></i>
            </div>
            <div class="text-center space-y-1">
                <h3 class="font-bold text-slate-900 text-base">대여 신청을 삭제하시겠습니까?</h3>
                <p id="delete-modal-info" class="text-xs text-slate-500 font-medium"></p>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="closeDeleteModal()" class="py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition-colors">
                    취소
                </button>
                <button id="confirm-delete-btn" class="py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl shadow-md shadow-rose-200 transition-colors">
                    삭제하기
                </button>
            </div>
        </div>
    </div>

    <!-- Application Logic & Realtime Multi-User Sync via Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDummyKeyForClassroomSync2026",
            authDomain: "classroom-sync-app.firebaseapp.com",
            projectId: "classroom-sync-app",
            storageBucket: "classroom-sync-app.appspot.com",
            messagingSenderId: "102938475612",
            appId: "1:102938475612:web:a1b2c3d4e5f67890"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ROOMS = ['1404호', '2205호', '2206호', '2408호', '3504호', '7210호'];
        const DEPTS = [
            { name: '스재/반산 조교', badgeClass: 'bg-blue-100 text-blue-800 border-blue-200', bgSolid: 'bg-blue-600', borderLeft: 'border-l-4 border-blue-500', bgLight: 'bg-blue-50/70' },
            { name: '의료뷰티 조교', badgeClass: 'bg-pink-100 text-pink-800 border-pink-200', bgSolid: 'bg-pink-500', borderLeft: 'border-l-4 border-pink-500', bgLight: 'bg-pink-50/70' },
            { name: '호텔조리 조교', badgeClass: 'bg-amber-100 text-amber-800 border-amber-200', bgSolid: 'bg-amber-500', borderLeft: 'border-l-4 border-amber-500', bgLight: 'bg-amber-50/70' },
            { name: '식품영양 조교', badgeClass: 'bg-emerald-100 text-emerald-800 border-emerald-200', bgSolid: 'bg-emerald-500', borderLeft: 'border-l-4 border-emerald-500', bgLight: 'bg-emerald-50/70' }
        ];

        const TIME_SLOTS = [
            '09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00', '21:00'
        ];

        let reservations = [];
        let selectedFilterRoom = 'ALL';
        let currentViewMode = 'timetable';
        let pendingDeleteId = null;
        let selectedFormDates = [];

        const MASTER_STORAGE_KEY = 'classroom_reservations_local_cache_v2';

        window.onload = async function() {
            const todayStr = getTodayDateString();
            document.getElementById('date-picker-input').value = todayStr;
            document.getElementById('filter-date').value = todayStr;

            selectedFormDates = [todayStr];
            renderDateChips();

            renderClassroomButtons();
            populateTimeDropdowns();
            renderFilterTabs();

            loadLocalReservations();
            renderAll();

            initRealtimeFirebase();
        };

        async function initRealtimeFirebase() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                const appId = typeof __app_id !== 'undefined' ? __app_id : 'shared-classroom-app';
                const reservationsCol = collection(db, 'artifacts', appId, 'public', 'data', 'reservations');

                onSnapshot(reservationsCol, (snapshot) => {
                    const cloudList = [];
                    snapshot.forEach(docSnap => {
                        cloudList.push({ id: docSnap.id, ...docSnap.data() });
                    });

                    reservations = cloudList;
                    saveLocalReservations();
                    renderAll();
                    updateSyncBadge(true);
                }, (error) => {
                    console.warn("Firestore listener warning:", error);
                    updateSyncBadge(false);
                });

            } catch (err) {
                console.warn("Firebase Auth Error:", err);
                updateSyncBadge(false);
            }
        }

        async function syncBookingToCloud(booking) {
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'shared-classroom-app';
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'reservations', booking.id);
                await setDoc(docRef, booking);
            } catch (e) {
                saveLocalReservations();
            }
        }

        async function deleteBookingFromCloud(bookingId) {
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'shared-classroom-app';
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'reservations', bookingId);
                await deleteDoc(docRef);
            } catch (e) {
                saveLocalReservations();
            }
        }

        function getTodayDateString() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function loadLocalReservations() {
            const saved = localStorage.getItem(MASTER_STORAGE_KEY);
            if (saved) {
                try { reservations = JSON.parse(saved); } catch(e) { reservations = []; }
            } else {
                reservations = [];
            }
        }

        function saveLocalReservations() {
            localStorage.setItem(MASTER_STORAGE_KEY, JSON.stringify(reservations));
        }

        function updateSyncBadge(isOnline) {
            const badge = document.getElementById('sync-status-badge');
            if (!badge) return;
            if (isOnline) {
                badge.className = "px-2 py-0.5 text-[10px] font-bold rounded-full bg-emerald-100 text-emerald-700 flex items-center gap-1";
                badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span> 실시간 전역 연동 연결됨`;
            } else {
                badge.className = "px-2 py-0.5 text-[10px] font-bold rounded-full bg-amber-100 text-amber-700 flex items-center gap-1";
                badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> 대기 중 (로컬 모드)`;
            }
        }

        function addSelectedDate() {
            const dateInput = document.getElementById('date-picker-input');
            const dateVal = dateInput.value;
            if (!dateVal) return;

            if (selectedFormDates.includes(dateVal)) {
                showToast('이미 선택된 날짜입니다.', 'info');
                return;
            }

            selectedFormDates.push(dateVal);
            selectedFormDates.sort();
            renderDateChips();
        }

        function removeSelectedDate(dateVal) {
            selectedFormDates = selectedFormDates.filter(d => d !== dateVal);
            renderDateChips();
        }

        function renderDateChips() {
            const container = document.getElementById('selected-date-chips');
            const countEl = document.getElementById('selected-dates-count');

            countEl.innerText = `${selectedFormDates.length}개 선택됨`;

            if (selectedFormDates.length === 0) {
                container.innerHTML = `<span class="text-xs text-slate-400 italic">선택된 날짜가 없습니다. 날짜를 추가해주세요.</span>`;
                return;
            }

            container.innerHTML = selectedFormDates.map(date => `
                <span class="inline-flex items-center gap-1 px-2.5 py-1 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-lg text-xs font-semibold">
                    ${date}
                    <button type="button" onclick="removeSelectedDate('${date}')" class="text-indigo-400 hover:text-rose-600 transition-colors ml-0.5">
                        <i class="fa-solid fa-xmark text-[11px]"></i>
                    </button>
                </span>
            `).join('');
        }

        function resetDataPrompt() {
            if (confirm('모든 예약 공유 데이터를 초기화하시겠습니까?')) {
                reservations.forEach(r => deleteBookingFromCloud(r.id));
                reservations = [];
                saveLocalReservations();
                renderAll();
                showToast('공유 데이터가 초기화되었습니다.', 'success');
            }
        }

        function getDeptConfig(deptName) {
            return DEPTS.find(d => d.name === deptName) || {
                name: deptName,
                badgeClass: 'bg-slate-100 text-slate-800 border-slate-200',
                bgSolid: 'bg-slate-600',
                borderLeft: 'border-l-4 border-slate-500',
                bgLight: 'bg-slate-50'
            };
        }

        function renderClassroomButtons() {
            const container = document.getElementById('classroom-selector-buttons');
            container.innerHTML = ROOMS.map((room) => `
                <button type="button" onclick="selectFormRoom('${room}')" id="room-btn-${room}"
                    class="room-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition-all text-center">
                    ${room}
                </button>
            `).join('');
            selectFormRoom(ROOMS[0]);
        }

        function selectFormRoom(room) {
            document.getElementById('form-room').value = room;
            document.querySelectorAll('.room-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600', 'shadow-sm');
                btn.classList.add('bg-slate-50', 'text-slate-600', 'border-slate-200');
            });
            const activeBtn = document.getElementById(`room-btn-${room}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-slate-50', 'text-slate-600', 'border-slate-200');
                activeBtn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600', 'shadow-sm');
            }
        }

        function populateTimeDropdowns() {
            const startSelect = document.getElementById('form-start-time');
            const endSelect = document.getElementById('form-end-time');

            const startOptions = TIME_SLOTS.slice(0, -1).map(t => `<option value="${t}">${t}</option>`).join('');
            const endOptions = TIME_SLOTS.slice(1).map(t => `<option value="${t}">${t}</option>`).join('');

            startSelect.innerHTML = startOptions;
            endSelect.innerHTML = endOptions;

            startSelect.value = '09:00';
            endSelect.value = '10:00';

            startSelect.addEventListener('change', () => {
                const startIdx = TIME_SLOTS.indexOf(startSelect.value);
                const endIdx = TIME_SLOTS.indexOf(endSelect.value);
                if (startIdx >= endIdx) {
                    endSelect.value = TIME_SLOTS[startIdx + 1] || TIME_SLOTS[TIME_SLOTS.length - 1];
                }
            });
        }

        function renderFilterTabs() {
            const container = document.getElementById('room-filter-tabs');
            const tabs = [{ id: 'ALL', name: '전체 강의실' }, ...ROOMS.map(r => ({ id: r, name: r }))];
            
            container.innerHTML = tabs.map(tab => {
                const isActive = selectedFilterRoom === tab.id;
                return `
                    <button onclick="setRoomFilter('${tab.id}')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${
                        isActive 
                        ? 'bg-slate-900 text-white shadow-sm' 
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }">
                        ${tab.name}
                    </button>
                `;
            }).join('');
        }

        function setRoomFilter(roomId) {
            selectedFilterRoom = roomId;
            renderFilterTabs();
            renderAll();
        }

        function switchViewMode(mode) {
            currentViewMode = mode;
            
            const btnTimetable = document.getElementById('view-mode-timetable');
            const btnCard = document.getElementById('view-mode-card');

            if (mode === 'timetable') {
                btnTimetable.className = 'px-2.5 py-1 rounded-lg text-xs font-semibold transition-all bg-white text-indigo-600 shadow-sm';
                btnCard.className = 'px-2.5 py-1 rounded-lg text-xs font-semibold transition-all text-slate-500 hover:text-slate-800';
            } else {
                btnCard.className = 'px-2.5 py-1 rounded-lg text-xs font-semibold transition-all bg-white text-indigo-600 shadow-sm';
                btnTimetable.className = 'px-2.5 py-1 rounded-lg text-xs font-semibold transition-all text-slate-500 hover:text-slate-800';
            }

            renderMainDisplay();
        }

        function renderAll() {
            renderSummaryCards();
            renderMainDisplay();
        }

        function renderSummaryCards() {
            const container = document.getElementById('room-summary-container');
            const selectedDate = document.getElementById('filter-date').value;

            container.innerHTML = ROOMS.map(room => {
                const count = reservations.filter(r => r.room === room && r.date === selectedDate).length;
                const isSelected = selectedFilterRoom === room;

                return `
                    <div onclick="setRoomFilter('${room}')" class="bg-white p-3 rounded-2xl border ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-100' : 'border-slate-200'} shadow-sm hover:shadow-md transition-all cursor-pointer flex flex-col justify-between">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-500">${room}</span>
                            <span class="w-2 h-2 rounded-full ${count > 0 ? 'bg-emerald-500' : 'bg-slate-300'}"></span>
                        </div>
                        <div class="mt-2 flex items-baseline justify-between">
                            <span class="text-xl font-extrabold ${count > 0 ? 'text-indigo-600' : 'text-slate-400'}">${count}건</span>
                            <span class="text-[10px] text-slate-400">오늘 대여</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMainDisplay() {
            const container = document.getElementById('display-container');
            const selectedDate = document.getElementById('filter-date').value;

            let filtered = reservations.filter(r => r.date === selectedDate);
            if (selectedFilterRoom !== 'ALL') {
                filtered = filtered.filter(r => r.room === selectedFilterRoom);
            }

            if (currentViewMode === 'timetable') {
                renderTimetable(container, filtered, selectedDate);
            } else {
                renderCardGrid(container, filtered, selectedDate);
            }
        }

        function renderTimetable(container, filtered, selectedDate) {
            const activeRooms = selectedFilterRoom === 'ALL' ? ROOMS : [selectedFilterRoom];
            const displayHours = TIME_SLOTS.slice(0, -1);

            let html = `
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full border-collapse text-left text-xs">
                        <thead>
                            <tr class="border-b border-slate-200">
                                <th class="p-2.5 font-bold text-slate-400 bg-slate-50/50 w-20 text-center sticky left-0 z-10">시간</th>
                                ${activeRooms.map(r => `
                                    <th class="p-2.5 font-bold text-slate-700 bg-slate-50/50 text-center min-w-[140px]">
                                        <div class="inline-block px-2.5 py-0.5 bg-slate-200/60 rounded-md">${r}</div>
                                    </th>
                                `).join('')}
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
            `;

            displayHours.forEach(hour => {
                html += `<tr>`;
                html += `<td class="p-2.5 font-semibold text-slate-400 text-center bg-slate-50/30 sticky left-0 border-r border-slate-100">${hour}</td>`;

                activeRooms.forEach(room => {
                    const matchingBooking = filtered.find(r => {
                        if (r.room !== room) return false;
                        return (r.startTime <= hour && r.endTime > hour);
                    });

                    if (matchingBooking) {
                        const deptCfg = getDeptConfig(matchingBooking.dept);
                        const isStart = matchingBooking.startTime === hour;

                        html += `
                            <td class="p-1 align-top">
                                <div class="h-full min-h-[46px] p-2 rounded-xl ${deptCfg.bgLight} ${deptCfg.borderLeft} flex flex-col justify-between relative group">
                                    <div class="flex items-center justify-between gap-1">
                                        <span class="font-bold text-[11px] text-slate-800 truncate">${matchingBooking.purpose}</span>
                                        ${isStart ? `
                                            <button onclick="openDeleteModal('${matchingBooking.id}')" class="text-slate-400 hover:text-rose-600 opacity-0 group-hover:opacity-100 transition-opacity p-0.5">
                                                <i class="fa-solid fa-xmark text-xs"></i>
                                            </button>
                                        ` : ''}
                                    </div>
                                    <div class="flex items-center justify-between text-[10px] text-slate-500 mt-1">
                                        <span class="font-medium text-slate-600 truncate">${matchingBooking.dept.replace(' 조교','')} (${matchingBooking.assistant.split(' ')[0]})</span>
                                        <span class="font-mono text-slate-400">${matchingBooking.startTime}-${matchingBooking.endTime}</span>
                                    </div>
                                </div>
                            </td>
                        `;
                    } else {
                        html += `
                            <td class="p-1">
                                <div class="h-full min-h-[46px] rounded-xl border border-dashed border-slate-100 hover:border-indigo-200 hover:bg-indigo-50/30 transition-all flex items-center justify-center text-slate-300">
                                    <span class="text-[10px] opacity-0 hover:opacity-100 text-indigo-400 font-medium">비어있음</span>
                                </div>
                            </td>
                        `;
                    }
                });

                html += `</tr>`;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        function renderCardGrid(container, filtered, selectedDate) {
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-16 text-slate-400 space-y-3">
                        <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center text-2xl text-slate-300">
                            <i class="fa-regular fa-calendar-xmark"></i>
                        </div>
                        <p class="text-sm font-medium">선택한 날짜 및 조건에 등록된 예약이 없습니다.</p>
                        <p class="text-xs text-slate-400">좌측 서식에서 새로 대여 신청을 등록해 보세요.</p>
                    </div>
                `;
                return;
            }

            filtered.sort((a, b) => a.startTime.localeCompare(b.startTime) || a.room.localeCompare(b.room));

            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                    ${filtered.map(item => {
                        const deptCfg = getDeptConfig(item.dept);
                        return `
                            <div class="bg-slate-50/60 hover:bg-slate-50 border border-slate-200 rounded-2xl p-4 shadow-sm hover:shadow transition-all space-y-3">
                                <div class="flex items-start justify-between gap-2">
                                    <div class="space-y-1">
                                        <div class="flex items-center gap-2">
                                            <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold bg-slate-900 text-white">${item.room}</span>
                                            <span class="px-2.5 py-0.5 rounded-lg text-xs font-semibold border ${deptCfg.badgeClass}">
                                                ${item.dept}
                                            </span>
                                        </div>
                                        <h3 class="font-bold text-slate-800 text-sm pt-1">${item.purpose}</h3>
                                    </div>
                                    <button onclick="openDeleteModal('${item.id}')" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg hover:bg-rose-50 transition-colors" title="삭제">
                                        <i class="fa-regular fa-trash-can text-sm"></i>
                                    </button>
                                </div>

                                <div class="pt-2 border-t border-slate-200/60 flex items-center justify-between text-xs text-slate-600">
                                    <div class="flex items-center gap-1.5 font-semibold text-indigo-700">
                                        <i class="fa-regular fa-clock"></i>
                                        <span>${item.startTime} ~ ${item.endTime}</span>
                                    </div>
                                    <div class="flex items-center gap-1 text-slate-500">
                                        <i class="fa-regular fa-user"></i>
                                        <span>${item.assistant}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        async function handleReservationSubmit(e) {
            e.preventDefault();

            const dept = document.getElementById('form-dept').value;
            const assistant = document.getElementById('form-assistant').value.trim();
            const room = document.getElementById('form-room').value;
            const startTime = document.getElementById('form-start-time').value;
            const endTime = document.getElementById('form-end-time').value;
            const purpose = document.getElementById('form-purpose').value.trim();

            if (selectedFormDates.length === 0) {
                showToast('최소 하나 이상의 사용 날짜를 선택해야 합니다.', 'error');
                return;
            }

            if (startTime >= endTime) {
                showToast('종료 시간은 시작 시간보다 나중이어야 합니다.', 'error');
                return;
            }

            const conflicts = [];
            selectedFormDates.forEach(date => {
                const conflict = reservations.find(r => {
                    if (r.room !== room || r.date !== date) return false;
                    return (startTime < r.endTime && endTime > r.startTime);
                });
                if (conflict) {
                    conflicts.push({ date, conflict });
                }
            });

            if (conflicts.length > 0) {
                const first = conflicts[0];
                showToast(`[중복 예약 발견] ${first.date} ${room}에 이미 ${first.conflict.startTime}~${first.conflict.endTime} (${first.conflict.dept}) 대여 일정이 있습니다.`, 'error');
                return;
            }

            for (const date of selectedFormDates) {
                const newBooking = {
                    id: 'res-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6),
                    dept,
                    assistant,
                    room,
                    date,
                    startTime,
                    endTime,
                    purpose
                };

                reservations.push(newBooking);
                await syncBookingToCloud(newBooking);
            }

            saveLocalReservations();

            document.getElementById('filter-date').value = selectedFormDates[0];
            document.getElementById('form-purpose').value = '';
            
            renderAll();
            showToast(`${room} 대여 신청이 저장 및 실시간 공유되었습니다.`, 'success');
        }

        function openDeleteModal(id) {
            const target = reservations.find(r => r.id === id);
            if (!target) return;

            pendingDeleteId = id;
            document.getElementById('delete-modal-info').innerText = `${target.date} | ${target.room} | ${target.startTime}~${target.endTime} (${target.dept})`;
            
            const modal = document.getElementById('delete-modal');
            const content = document.getElementById('delete-modal-content');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);

            document.getElementById('confirm-delete-btn').onclick = confirmDelete;
        }

        function closeDeleteModal() {
            const modal = document.getElementById('delete-modal');
            const content = document.getElementById('delete-modal-content');
            
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                pendingDeleteId = null;
            }, 200);
        }

        async function confirmDelete() {
            if (!pendingDeleteId) return;

            const targetId = pendingDeleteId;
            reservations = reservations.filter(r => r.id !== targetId);
            
            await deleteBookingFromCloud(targetId);
            saveLocalReservations();

            closeDeleteModal();
            renderAll();
            showToast('대여 신청이 삭제되었습니다.', 'info');
        }

        let toastTimeout;
        function showToast(msg, type = 'info') {
            clearTimeout(toastTimeout);
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            const iconEl = document.getElementById('toast-icon');

            msgEl.innerText = msg;

            if (type === 'error') {
                iconEl.innerHTML = `<i class="fa-solid fa-circle-exclamation text-rose-500"></i>`;
                toast.className = toast.className.replace(/border-\w+-200/, 'border-rose-200');
            } else if (type === 'success') {
                iconEl.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500"></i>`;
                toast.className = toast.className.replace(/border-\w+-200/, 'border-emerald-200');
            } else {
                iconEl.innerHTML = `<i class="fa-solid fa-circle-info text-indigo-500"></i>`;
                toast.className = toast.className.replace(/border-\w+-200/, 'border-indigo-200');
            }

            toast.classList.remove('translate-y-[-100px]', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-0', 'opacity-100');

            toastTimeout = setTimeout(() => {
                hideToast();
            }, 3500);
        }

        function hideToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('translate-y-[-100px]', 'opacity-0', 'pointer-events-none');
            toast.classList.remove('translate-y-0', 'opacity-100');
        }

        window.addSelectedDate = addSelectedDate;
        window.removeSelectedDate = removeSelectedDate;
        window.selectFormRoom = selectFormRoom;
        window.setRoomFilter = setRoomFilter;
        window.switchViewMode = switchViewMode;
        window.handleReservationSubmit = handleReservationSubmit;
        window.openDeleteModal = openDeleteModal;
        window.closeDeleteModal = closeDeleteModal;
        window.resetDataPrompt = resetDataPrompt;
        window.renderAll = renderAll;
    </script>
</body>
</html>
